# Canonical source: homelab services/systemd/mcp-restart-policy.conf (OB-65593).
# This copy mirrors it so scripts/install-systemd.sh installs the same policy the
# fleet installer does; change the homelab template first, then sync here (OB-65595, OB-68283).
#
# A finite start-limit window turns any outage longer than burst x delay into a
# permanent `failed` state (start-limit-hit), which Restart=always never leaves:
# twilio-mcp stayed down 3.3 days after a 7-minute DNS outage on 2026-10-13.
# Disable the limit and back off instead: the first retry after 5s, the delay
# growing to 5 minutes over 6 steps, then every 300s until the dependency
# returns. RestartSteps / RestartMaxDelaySec need systemd 254+ (Furnace: 255).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
RestartSteps=6
RestartMaxDelaySec=300
