# Drop-in override added 2026-05-18 after a mass MCP shutdown left
# discord-mcp + devto-mcp dead for 9.5h. `Restart=on-failure` does not
# catch SIGTERM (treated as a clean shutdown), so any external kill
# leaves the service permanently down. `Restart=always` covers clean
# kills too. StartLimit* widens the flap-protection window from the
# default 10s to 5min, which is what you actually want when a deploy
# script briefly cycles a whole fleet.
# OB-53766 (2026-08-09): the 2026-05-18 sizing above was too tight. On the
# 2026-08-08 unclean boot, network-online.target was reached at 06:45:55 but DNS
# did not resolve until ~06:46:59 (~64s). Burst=5 at RestartSec=5 spends the whole
# budget in ~25-40s, so systemd gave up permanently and this service stayed down
# 16.5h - the same failure class the 2026-05-18 drop-in was meant to prevent.
# Widened to 20 attempts over 15min so the envelope outlasts a slow-DNS boot.
[Unit]
StartLimitBurst=20
StartLimitIntervalSec=900

[Service]
Restart=always
RestartSec=15
